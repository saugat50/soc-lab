filebeat.inputs:
- type: filestream
  id: auth-logs
  enabled: true
  paths:
    - /home/*/soc-lab/data/raw/auth/*.json
  parsers:
    - ndjson:
        overwrite_keys: true
        add_error_key: true

- type: filestream
  id: suricata-eve
  enabled: true
  paths:
    - /var/log/suricata/eve.json
  parsers:
    - ndjson:
        overwrite_keys: true
        add_error_key: true

output.elasticsearch:
  hosts: ["http://localhost:9200"]

setup.kibana:
  host: "http://localhost:5601"
